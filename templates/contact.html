{% extends 'base.html' %}

{% block title %} Home Page {% endblock title %}

{% block content %}
<main class="container my-4">

    <h1 class="text-center mb-5 p-4 fs-2">Welcome to My Site</h1>

    <h5 class="text-info text-center p-2 mb-4 fs-3">For any questions or concerns!</h5>

    <div class="row g-4">
        <!-- Contact Form Column -->
        <div class="col-md-6">
            <form class="p-4 border rounded bg-secondary bg-opacity-10 shadow-sm">
                <h3 class="mb-3">Contact us!</h3>
                
                <div class="mb-3">
                    <label id="nameLabel" for="userName" class="form-label">Name</label>
                    <input class="form-control" id="userName" type="text" placeholder="Name" aria-labelledby="nameLabel">
                </div>
                
                <div class="mb-3">
                    <label id="emailLabel" for="userEmail" class="form-label">Email address</label>
                    <input class="form-control" id="userEmail" type="email" placeholder="name@example.com" aria-labelledby="emailLabel">
                </div>
                
                <div class="mb-3">
                    <label id="messageLabel" for="userMessage" class="form-label">Message</label>
                    <textarea class="form-control" id="userMessage" rows="4" placeholder="Your message here..." aria-labelledby="messageLabel"></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mt-2">Submit</button>
            </form>
        </div>

        <!-- Image Column -->
        <div class="col-md-6 d-flex align-items-stretch">
            <img src="https://images.unsplash.com/photo-1775120062029-f5b7eb28e737?q=80&w=1035&auto=format&fit=crop" class="img-fluid rounded object-fit-cover w-100" alt="Contact illustration">
        </div>
    </div>

</main>
{% endblock content %}
