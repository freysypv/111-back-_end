<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>{% block title %}{% endblock title %}</title>
    
</head>
<body>
<nav class="navbar navbar-expand-lg bg-light-subtle opacity_70 " data-bs-theme="dark ">
    <div class="container-fluid d-flex flex-row-reverse">
      <a class="navbar-brand" href="#">My Website</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="{{url_for('home')}}">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="{{url_for('about')}}">About</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="{{url_for('contact')}}">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

<main>

    {% block content %}
   <!-- Here your content -->

    {% endblock content%}
</main>




<footer class="footer bg-light-subtle text-light text-center p-4 mt-5 opacity-70 fs-5 rounded-end box-shodow-10"> 


  <div class="d-flex flex-column m-4 p-2 text-dark">
      <h4>Contact Us</h4>
      <p >
          Email: <a href="mailto:example@email.com">example@email.com</a>
      </p>
      <p>
          Phone: <a href="tel:+1234567890">+1 (973) 567-890</a>
      </p>
      <p>
          Address: 123 Main Street, Anytown, USA
      </p>
      
  </div>

  <div class="d-flex flex-column-reverse mb-3 ">
    <h4 class="text-dark">Earth day</h4>
    <ul>
      <a class="text-info" href="{{url_for('about')}}">About</a>
     
      
    </ul>
  </div>


  <div class="d-flex flex-row mb-2 p-2">
    <h5 class="text-dark">Newsletter</h5>
 
    <form class="p-2 m-2">
      <input type="email" placeholder="Enter your email">
      <button class="rounded bg-success box-shodow-20 " type="submit">Send</button>
    </form>
  </div>

  <div class="d-flex flex-row mb-3 p-2 bg-opacity-50 btn-primery text-dark w-100 rounded-end  ">

          <a href="https://facebook.com//yourProfile" target="_blank" rel="noopener noreferrer" class='btn btn-primary text-light m-1 p-2'>Facebook</a>
          <br />
          <a href="https://twitter.com//yourProfile" target="_blank" rel="noopener noreferrer" class='btn btn-info text-light m-1 p-2' >Twitter</a>
          <br />
          <a href="https://instagram.com//yourProfile" target="_blank" rel="noopener noreferrer" class='btn btn-success text-light m-1 p-2 ' >Instagram</a>
          <br />
          <a href="https://youtube.com//yourProfile" target="_blank" rel="noopener noreferrer" class="btn btn-danger text-light m-2 p-2">YouTube</a>
  </div>
</footer>
  
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
